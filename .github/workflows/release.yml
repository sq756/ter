name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            goos: darwin
            binary_name: agent_macos
          - platform: ubuntu-22.04
            goos: linux
            binary_name: agent_linux_amd64
          - platform: windows-latest
            goos: windows
            binary_name: agent.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          work-dir: src-tauri

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ter_agent/go.sum

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Agent
        shell: bash
        run: |
          cd ter_agent
          GOOS=${{ matrix.goos }} GOARCH=amd64 go build -o ${{ matrix.binary_name }} main.go || true
          cd ..

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ter ${{ github.ref_name }} - Cyber Edition"
          releaseBody: "Desktop Release (Windows, Linux, macOS)"
          releaseDraft: false
          prerelease: false

