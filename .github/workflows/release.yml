name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          work-dir: src-tauri

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ter_agent/go.sum

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Agent
        shell: bash
        run: |
          cd ter_agent
          GOOS=linux GOARCH=amd64 go build -o agent_linux_amd64 main.go
          cd ..

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
          CARGO_NET_RETRY: 10
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ter v__VERSION__ - Cyber Edition"
          releaseBody: "Release of Ter SSH Visual Manager with God's View & Cyber-Transparency Mode."
          releaseDraft: false
          prerelease: false
